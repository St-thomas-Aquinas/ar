<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My First WebXR Scene</title>

    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>

  <body>
    <a-scene>

      <!-- Camera -->
      <a-entity camera position="0 1.6 3"></a-entity>

      <!-- 3D Box -->
      <a-box 
        position="0 1 -3"
        rotation="0 45 0"
        color="#4CC3D9">
      </a-box>

      <!-- Floor -->
      <a-plane 
        position="0 0 -4"
        rotation="-90 0 0"
        width="10"
        height="10"
        color="#7BC8A4">
      </a-plane>

      <!-- Sky -->
      <a-sky color="#ECECEC"></a-sky>

    </a-scene>
  </body>
</html>
